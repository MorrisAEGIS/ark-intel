services:
  ark-intel:
    build:
      context: .
      dockerfile: Dockerfile
    image: ark-intel:0.1.0
    container_name: ark-intel
    restart: unless-stopped
    env_file:
      - /home/novaadmin/.config/ark-intel/env
    environment:
      ARK_INTEL_HOST: 0.0.0.0
      ARK_INTEL_PORT: 7010
      ARK_INTEL_DATABASE_PATH: /var/lib/ark-intel/ark-intel.sqlite3
    ports:
      - "127.0.0.1:7010:7010"
    volumes:
      - ark-intel-data:/var/lib/ark-intel
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7010/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ark-intel-net
      - ark-net

volumes:
  ark-intel-data:

networks:
  ark-intel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
  ark-net:
    external: true
