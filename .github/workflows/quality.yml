name: ArkIntel Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ark-intel-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test environment
        run: python -m pip install --disable-pip-version-check '.[test]' ruff==0.15.10
      - name: Lint
        run: python -m ruff check arkintel tests
      - name: Test
        env:
          ARK_INTEL_SERVICE_TOKEN: ci-test-token
          ARK_INTEL_DATABASE_PATH: /tmp/ark-intel-ci.sqlite3
        run: python -m pytest -q
