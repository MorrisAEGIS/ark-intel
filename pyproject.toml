[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ark-intel"
version = "0.1.0"
description = "Sovereign, policy-gated OSINT broker derived from OSIRIS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.136.3",
  "httpx==0.28.1",
  "pydantic-settings==2.7.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["arkintel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
